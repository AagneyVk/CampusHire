services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: campushire
      MYSQL_USER: campushire
      MYSQL_PASSWORD: campushire
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/views.sql:/docker-entrypoint-initdb.d/02-views.sql:ro
      - ./database/business_rules.sql:/docker-entrypoint-initdb.d/03-business-rules.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/04-seed.sql:ro
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-ucampushire","-pcampushire"]
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build: ./backend
    environment:
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: campushire
      DB_USER: campushire
      DB_PASSWORD: campushire
      JWT_SECRET: local-development-secret-change-me
      CORS_ORIGIN: http://localhost:5173
      DEMO_ACCOUNTS: "true"
    ports: ["4000:4000"]
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  mysql_data:
